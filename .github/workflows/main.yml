name: 影视自动剪辑项目测试

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 下载项目代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: 检查 Python 语法
        run: |
          python -m compileall -q modules app config
        continue-on-error: true

      - name: 测试核心模块
        run: |
          python -c "import modules.collector; print('素材采集模块正常')"
          python -c "import modules.analyzer; print('AI分析模块正常')"
          python -c "import modules.editor; print('视频剪辑模块正常')"
          python -c "import modules.writer; print('文案生成模块正常')"

      - name: 检查 FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: 运行主程序
        run: |
          python app/main.py
        continue-on-error: true
