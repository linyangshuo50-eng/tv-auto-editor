name: 影视自动剪辑项目测试

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 下载项目代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查 Python 语法
        run: |
          python -m compileall -q app modules config

      - name: 测试核心模块
        run: |
          python -c "from modules.collector import VideoCollector; print('素材采集模块正常')"
          python -c "from modules.analyzer import VideoAnalyzer; print('分析模块正常')"
          python -c "from modules.editor import VideoEditor; print('剪辑模块正常')"
          python -c "from modules.writer import VideoWriter; print('文案模块正常')"

      - name: 运行主程序
        run: |
          python -m app.main
